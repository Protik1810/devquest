name: CI
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit & content tests
        run: npm test
      - name: Build (downloads the offline Python/React runtimes)
        run: npm run build
      - name: Verify Python exercises in the bundled Pyodide
        # A starter or solution that loops forever would hang the run, so cap it
        timeout-minutes: 10
        run: npm run verify:python
      - name: Verify JavaScript and TypeScript exercises with the app's runtime
        timeout-minutes: 10
        run: npm run verify:js
      - name: Verify native-language exercises with real compilers
        # Exercises for toolchains that aren't installed on the runner are skipped
        run: |
          sudo apt-get update && sudo apt-get install -y golang-go ruby php-cli r-base-core lua5.4 || true
          npm run verify:native
